services:

  airflow:

    image: apache/airflow:2.10.5

    container_name: airflow

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
      - ../.env:/opt/airflow/project/.env

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    command: >
      bash -c "
      pip install
      boto3
      pandas
      snowflake-connector-python
      snowflake-sqlalchemy
      python-dotenv
      kaggle
      slack_sdk &&
      airflow standalone
      "